[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nm_cleaner"
version = "0.1.0"
description = "A tool to clean node_modules and __pycache__ directories recursively"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "furuya02", email = "spw0022@gmail.com" }
]
keywords = ["node_modules", "__pycache__", "cleanup", "cli", "npm", "nodejs", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
nm_cleaner = "nm_cleaner.main:main"

[project.urls]
Homepage = "https://github.com/furuya02/nm_cleaner"
Repository = "https://github.com/furuya02/nm_cleaner"
Issues = "https://github.com/furuya02/nm_cleaner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nm_cleaner"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
